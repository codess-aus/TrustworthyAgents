site_name: Building Trustworthy AI Agents
site_description: Companion site for the Global AI Security Bootcamp talk
site_url: https://codess-aus.github.io/TrustworthyAgents/
repo_url: https://github.com/codess-aus/TrustworthyAgents
repo_name: codess-aus/TrustworthyAgents

theme:
  name: material
  language: en
  font:
    text: Atkinson Hyperlegible
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition

nav:
  - Home: index.md
  - Hook + Context:
    - Slide 1 · Title: slide-01-title.md
    - Slide 2 · The Vibe Shift: slide-02-vibe-shift.md
    - Slide 3 · What We're Covering: slide-03-agenda.md
  - What Is an AI Agent?:
    - Slide 4 · So What Is an AI Agent?: slide-04-what-is-an-agent.md
    - Slide 5 · The Agent Spectrum: slide-05-agent-spectrum.md
    - Slide 6 · Cloud-Native Agents in the SDLC: slide-06-cloud-native-sdlc.md
  - The Threat Landscape:
    - Slide 7 · The Threat Landscape: slide-07-threat-landscape.md
    - Slide 8 · OWASP Top Threats for Agents: slide-08-owasp-threats.md
    - Slide 9 · Prompt Injection - Show Don't Tell: slide-09-prompt-injection.md
    - Slide 10 · The Attack Surface Map: slide-10-attack-surface.md
  - Building Trustworthy Agents:
    - Slide 11 · Framework Overview: slide-11-framework-overview.md
    - Slide 12 · Layer 1 - Secure Design: slide-12-secure-design.md
    - Slide 13 · Layer 2 - Identity and Least Privilege: slide-13-identity-least-privilege.md
    - Slide 14 · Layer 3 - Runtime Controls: slide-14-runtime-controls.md
    - Slide 15 · Layer 4 - Observability: slide-15-observability.md
    - Slide 16 · Layer 5 - Governance: slide-16-governance.md
  - Live Demo:
    - Slide 17 · Live Demo: slide-17-live-demo.md
  - Call to Action:
    - Slide 18 · The Developer Is Your Ally: slide-18-developer-ally.md
    - Slide 19 · Agent Security Checklist: slide-19-checklist.md
    - Slide 20 · The Only Question That Matters: slide-20-closing.md
